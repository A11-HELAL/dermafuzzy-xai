[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dermafuzzy-xai"
version = "0.1.0"
description = "Explainable Melanoma Diagnosis via Fuzzy Border Uncertainty and Attention-Verified Deep Biomarkers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "scipy>=1.11.0",
    "scikit-fuzzy>=0.5.0",
    "matplotlib>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
pythonpath = ["packages", "."]
testpaths = ["tests"]
addopts = "-v"
